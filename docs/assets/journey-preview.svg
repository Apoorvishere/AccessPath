<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Concept journey from Home to Support to Contact</title>
  <desc id="description">A conceptual report links a visitor task to the pages encountered and an example form-label finding.</desc>
  <rect width="1200" height="420" fill="#BDD4E7"/>
  <text x="60" y="60" fill="#212227" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">CONCEPT / NOT A LIVE SCAN</text>
  <text x="60" y="113" fill="#212227" font-family="Arial,sans-serif" font-size="34" font-weight="700">Find the contact form</text>
  <path d="M104 202H1066" stroke="#637074" stroke-width="3"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="117" cy="202" r="27" fill="#212227"/><text x="117" y="208" fill="white" font-size="18">01</text>
    <circle cx="571" cy="202" r="27" fill="#637074"/><text x="571" y="208" fill="white" font-size="18">02</text>
    <circle cx="1055" cy="202" r="27" fill="#212227"/><text x="1055" y="208" fill="white" font-size="18">03</text>
    <text x="117" y="259" fill="#212227" font-size="22" font-weight="700">Home</text>
    <text x="571" y="259" fill="#212227" font-size="22" font-weight="700">Support</text>
    <text x="1055" y="259" fill="#212227" font-size="22" font-weight="700">Contact</text>
  </g>
  <rect x="60" y="303" width="1080" height="70" fill="#212227"/>
  <rect x="60" y="303" width="6" height="70" fill="#8693AB"/>
  <text x="84" y="331" fill="#AAB9CF" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">ILLUSTRATIVE FINDING / RULE: LABEL</text>
  <text x="84" y="356" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="700">The email field has no accessible label.</text>
  <text x="1127" y="353" fill="#BDD4E7" font-family="Arial,sans-serif" font-size="24" text-anchor="end">↗</text>
</svg>
